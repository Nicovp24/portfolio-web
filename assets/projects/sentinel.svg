<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#17213a"/>
      <stop offset="1" stop-color="#0b1020"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10z" fill="#6f86c9"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <text x="64" y="84" fill="#ffffff" font-size="34" font-weight="800">Sentinel</text>
  <text x="64" y="118" fill="#9aa8d6" font-size="17">Data decides. Gemini explains. Zero human babysitting.</text>
  <g transform="translate(64,142)" font-size="13">
    <rect width="178" height="30" rx="15" fill="#1d2a4d"/>
    <circle cx="18" cy="15" r="5" fill="#9aa8d6"/>
    <text x="32" y="20" fill="#c9d3f5">deterministic (no LLM)</text>
    <rect x="190" width="140" height="30" rx="15" fill="#2a2150"/>
    <circle cx="208" cy="15" r="5" fill="#b69cff"/>
    <text x="222" y="20" fill="#ddd2ff">Gemini agent</text>
  </g>

  <g stroke="#6f86c9" stroke-width="2.4" fill="none" marker-end="url(#arr)">
    <path d="M274 420 H384"/>
    <path d="M574 420 H684"/>
    <path d="M780 360 V246"/>
    <path d="M820 246 V360"/>
    <path d="M876 420 H986"/>
    <path d="M1080 480 V586"/>
  </g>
  <g font-size="12" fill="#9aa8d6">
    <text x="284" y="408">job_ready</text>
    <text x="586" y="408">exit_code, logs</text>
    <text x="690" y="306" text-anchor="end">if fail: logs</text>
    <text x="830" y="306">diagnosis</text>
    <text x="890" y="408">verdict + action</text>
  </g>

  <!-- nodes -->
  <g>
    <g transform="translate(84,360)">
      <rect width="190" height="120" rx="18" fill="#141d36" stroke="#3a4a80" stroke-width="1.6"/>
      <circle cx="30" cy="34" r="7" fill="#9aa8d6"/>
      <text x="46" y="40" fill="#ffffff" font-size="19" font-weight="700">Watcher</text>
      <text x="22" y="74" fill="#9aa8d6" font-size="13">GitHub webhook</text>
      <text x="22" y="96" fill="#9aa8d6" font-size="13">trigger validation</text>
    </g>
    <g transform="translate(384,360)">
      <rect width="190" height="120" rx="18" fill="#141d36" stroke="#3a4a80" stroke-width="1.6"/>
      <circle cx="30" cy="34" r="7" fill="#9aa8d6"/>
      <text x="46" y="40" fill="#ffffff" font-size="19" font-weight="700">Executor</text>
      <text x="22" y="74" fill="#9aa8d6" font-size="13">runs the check</text>
      <text x="22" y="96" fill="#9aa8d6" font-size="13">raw exit code</text>
    </g>
    <g transform="translate(686,360)">
      <rect width="190" height="120" rx="18" fill="#221a45" stroke="#7b61d9" stroke-width="1.8" filter="url(#glow)"/>
      <circle cx="30" cy="34" r="7" fill="#b69cff"/>
      <text x="46" y="40" fill="#ffffff" font-size="19" font-weight="700">Decision</text>
      <text x="22" y="74" fill="#cbbcff" font-size="13">close_ok · retry ·</text>
      <text x="22" y="96" fill="#cbbcff" font-size="13">escalate · propose_fix</text>
    </g>
    <g transform="translate(686,126)">
      <rect width="190" height="120" rx="18" fill="#221a45" stroke="#7b61d9" stroke-width="1.6"/>
      <circle cx="30" cy="34" r="7" fill="#b69cff"/>
      <text x="46" y="40" fill="#ffffff" font-size="19" font-weight="700">Diagnostician</text>
      <text x="22" y="74" fill="#cbbcff" font-size="13">only on failure</text>
      <text x="22" y="96" fill="#cbbcff" font-size="13">repeat-failure memory</text>
    </g>
    <g transform="translate(986,360)">
      <rect width="190" height="120" rx="18" fill="#221a45" stroke="#7b61d9" stroke-width="1.6"/>
      <circle cx="30" cy="34" r="7" fill="#b69cff"/>
      <text x="46" y="40" fill="#ffffff" font-size="19" font-weight="700">Reporter</text>
      <text x="22" y="74" fill="#cbbcff" font-size="13">drafts the message</text>
      <text x="22" y="96" fill="#cbbcff" font-size="13">for humans</text>
    </g>
  </g>

  <!-- discord message -->
  <g transform="translate(720,592)">
    <rect width="496" height="150" rx="16" fill="#1e2233" stroke="#33395a"/>
    <rect x="18" y="20" width="4" height="110" rx="2" fill="#f2cc60"/>
    <circle cx="56" cy="44" r="18" fill="#5865f2"/>
    <path d="M47 46 q9 8 18 0" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <text x="86" y="40" fill="#ffffff" font-size="15" font-weight="700">Sentinel <tspan fill="#9aa8d6" font-weight="400" font-size="12">BOT · #qa</tspan></text>
    <text x="86" y="66" fill="#dfe3f5" font-size="14">❌ checkout-flow failed (exit 1) — 3rd time today.</text>
    <text x="86" y="90" fill="#dfe3f5" font-size="14">Likely cause: selector changed on payment step.</text>
    <text x="86" y="114" fill="#f2cc60" font-size="14">Action: escalate_to_human + proposed fix attached</text>
  </g>

  <g transform="translate(64,600)" font-size="14" fill="#9aa8d6">
    <text fill="#ffffff" font-size="16" font-weight="700">Stack</text>
    <text y="30">Python · Google ADK · Gemini API</text>
    <text y="54">Cloud Run · Firestore · Discord webhooks</text>
    <text y="90" fill="#c9d3f5">All Things Agentic Hackathon — Taskmaster track</text>
  </g>
</svg>
